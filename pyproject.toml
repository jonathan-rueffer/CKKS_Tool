[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ckks-param-tool"
version = "0.2.0"
description = "Data-driven decision support for CKKS parameter selection in privacy-preserving ML inference"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jonathan Rueffer" }]
dependencies = [
    "tenseal>=0.3.16",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "rich>=13",
]

[project.optional-dependencies]
mnist = ["torch>=2.4"]
dev = ["pytest>=8"]

[project.scripts]
ckks-param-tool = "ckks_param_tool.cli:main"

[tool.setuptools.packages.find]
include = ["ckks_param_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
